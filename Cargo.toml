[package]
name = "pshenmic-dpp"
authors = ["owl352 <kokosinca123@gmail.com>"]
version = "2.1.0-dev.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
dpp = { git = "https://github.com/dashpay/platform", tag = "v5.0.0-rc.8", default-features = false, features = [
    "identity-value-conversion",
    "identity-serialization",
    "state-transition-signing",
    "platform-value",
    "document-json-conversion",
    "data-contract-json-conversion"
] }
drive = { git = "https://github.com/dashpay/platform", tag = "v5.0.0-rc.8", default-features = false, features = [
    "verify"
] }
indexmap = "2.0.2"
napi = {version = "=3.11.0", features = ["napi3", "async"], default-features = false}
napi-derive = "=3.6.0"
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
hex = "0.4.3"
sha2 = "0.10.8"


[build-dependencies]
napi-build = "~2.3.1"
napi-derive-backend = "=6.0.0"

[profile.release]
lto = "fat"
opt-level = 3
strip = "symbols"
codegen-units = 1
panic = "abort"
incremental = false
debug = false

# The base wasm build must stay under Chrome's 8MB main-thread sync-compile
# limit (see build.cjs), so dependencies optimize for minimal size. The proving
# stack lives in the separate dash-platform-shielded package, not here.
[profile.release-wasm]
inherits = "release"
opt-level = "z"

# Fat LTO optimizes the whole linked module at the root crate's opt-level; "s"
# keeps the base module small without the size penalty of "z" everywhere.
[profile.release-wasm.package.pshenmic-dpp]
opt-level = "s"
