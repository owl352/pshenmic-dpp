[package]
name = "pshenmic-dpp"
authors = ["owl352 <kokosinca123@gmail.com>"]
version = "2.0.0-dev.6"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
dpp = { git = "https://github.com/owl352/platform", rev = "3a4fd23", default-features = false, features = [
    "identity-value-conversion",
    "identity-serialization",
    "state-transition-signing",
    "platform-value",
    "document-json-conversion",
    "data-contract-json-conversion"
] }
drive = { git = "https://github.com/owl352/platform", rev = "3a4fd23", default-features = false, features = [
    "verify"
] }
indexmap = { version = "2.0.2" }
napi = {version = "3.8.1", features = ["napi3", "serde-json"], default-features = false}
napi-derive = "3.5.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
hex = "0.4.3"
sha2 = "0.10.8"

[build-dependencies]
napi-build = "2.3.1"

[profile.release]
lto = "fat"
opt-level = "z"
strip = "symbols"
codegen-units = 1
panic = "abort"
incremental = false
debug = false
