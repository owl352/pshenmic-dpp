name: Build & Test

on:
  push:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]
  pull_request:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-dist.yml
    with:
      # Only the targets the test matrix runs on; publish.yml builds them all.
      native-groups: >-
        [
          {"name": "darwin", "targets": "aarch64-apple-darwin"},
          {"name": "linux", "targets": "x86_64-unknown-linux-gnu"},
          {"name": "windows", "targets": "x86_64-pc-windows-msvc"}
        ]
      react-native: false

  test:
    name: Test ${{ matrix.settings.target }} (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        settings:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup QEMU
        if: runner.os == 'Linux' && contains(matrix.settings.target, 'aarch64')
        uses: docker/setup-qemu-action@v4

      - name: Install project dependencies
        run: |
          yarn install

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact-dist
          path: ./dist

      - name: Run tests
        run: yarn test
