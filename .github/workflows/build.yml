name: Build & Test

on:
  push:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]
  pull_request:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-dist.yml
    with:
      # Only the targets the test matrix runs on; publish.yml builds them all.
      native-groups: >-
        [
          {"name": "darwin", "targets": "aarch64-apple-darwin", "os": "macos-latest"},
          {"name": "linux", "targets": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest"},
          {"name": "windows", "targets": "x86_64-pc-windows-msvc", "os": "ubuntu-latest"}
        ]
      react-native: false

  test:
    name: Test ${{ matrix.settings.target }} (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        settings:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup QEMU
        if: runner.os == 'Linux' && contains(matrix.settings.target, 'aarch64')
        uses: docker/setup-qemu-action@v4

      - name: Install project dependencies
        run: |
          yarn install

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact-dist
          path: ./dist

      - name: Download orchard build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact-orchard
          path: packages/orchard

      - name: Run tests
        run: yarn test

  # Browser e2e for the shielded split (dash-platform-extension#219): base
  # imports without cross-origin isolation, initShielded() loads the threaded
  # proving module on demand, COOP/popup behavior matrix (Chromium + Firefox).
  # Self-contained: builds its own bins (build:bin + build:ts) because the
  # suite runs against dist and needs the host native addon as its regression
  # oracle.
  e2e:
    name: Browser e2e (shielded split)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # Same toolchain pair as build-dist.yml's wasm job: pinned nightly for
      # the shielded build-std, stable for the base wasm + typings.
      - name: Setup Rust nightly (shielded wasm build-std)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-15
          targets: wasm32-wasip1-threads
          components: rust-src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-wasip1, x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: e2e

      - name: Install wasm-opt
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-opt

      # The host native addon (linux-gnu) builds with cargo-zigbuild, like the
      # native job's linux group in build-dist.yml.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install pre-built Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # clang for the wasm32 C dependencies; the `llvm` package provides
      # llvm-ar for the base emnapi link archive (GNU ar can't index wasm
      # objects).
      - name: Install LLVM for WebAssembly
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install project dependencies
        run: yarn install --immutable

      # build:bin scoped to what the suite needs: both wasm binaries, the host
      # native addon (byte-regression oracle), typings and the bundle.
      - name: Build binaries
        run: node build.cjs
        env:
          BUILD_STEPS: wasm,native,typings,bundle
          NATIVE_BUILD_TARGET: x86_64-unknown-linux-gnu
          WASM_TOOLCHAIN: nightly-2026-08-15
          BASE_WASM_TOOLCHAIN: 1.99
          RUSTFLAGS: '-C target-feature=-crt-static'
          # Empty sysroot for the wasm C builds (see build-dist.yml).
          CFLAGS_wasm32_wasip1_threads: --sysroot=/nonexistent
          CFLAGS_wasm32_wasip1: --sysroot=/nonexistent

      - name: Build TypeScript
        run: yarn build:ts

      # Browser downloads are ~100MiB per engine; cache them across runs.
      # Keyed on package.json (the playwright pin); yarn.lock is gitignored.
      # `playwright install` is idempotent, so a stale cache only costs a
      # download, never correctness.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run browser e2e tests
        run: npm run test:e2e
