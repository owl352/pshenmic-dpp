name: Build

on:
  push:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]
  pull_request:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Add rustup WASM target
      run: |
        rustup target add wasm32-wasip1-threads

    - name: GCC Multilib
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib --fix-missing

    - name: Add rustup mobile targets
      run: |
        rustup target add aarch64-apple-ios-sim aarch64-linux-android x86_64-linux-android

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager --install "ndk;27.1.12297006"

    - name: Check Rust code linting rules
      run: |
        cargo fmt --check

    - name: Install Rust dependencies for WASM
      run: |
        cargo install wasm-bindgen-cli@0.2.105 wasm-opt

    - name: Install dependencies
      run: |
        yarn

    - name: Build JS bundle
      run: |
        yarn build:full

    - name: Run tests
      run: |
        yarn test
