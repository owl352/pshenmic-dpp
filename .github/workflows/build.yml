name: Build & Test

on:
  push:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]
  pull_request:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]

jobs:
  build:
    name: Build ${{ matrix.settings.target }} (Node ${{ matrix.node-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        settings:
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.1.12297006"

      # The wasm build rebuilds std with atomics (-Z build-std) for the Orchard
      # /Halo 2 proving stack, which requires nightly + rust-src. Pinned for
      # reproducible, flag-stable artifacts (see WASM_TOOLCHAIN below). Installed
      # first so the stable step below stays the rustup default for native builds.
      - name: Setup Rust nightly (wasm build-std)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-17
          targets: wasm32-wasip1-threads
          components: rust-src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1-threads, x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl, aarch64-linux-android, x86_64-linux-android, aarch64-apple-ios-sim, aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
          components: rustfmt, rust-src

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      # The Microsoft CRT/SDK headers cargo-xwin downloads for the windows-msvc
      # targets are ~1GB and are not covered by rust-cache.
      - name: Cache xwin CRT/SDK
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/cargo-xwin
          key: ${{ runner.os }}-cargo-xwin

      - name: Install pre-built Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild, cargo-xwin, wasm-bindgen-cli@0.2.105, wasm-opt

      - name: Install LLVM for WebAssembly (macOS)
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Install project dependencies & Wasm tools
        run: |
          yarn install --immutable

      - name: Build JS bundle
        run: yarn build:full
        env:
          RUSTFLAGS: '-C target-feature=-crt-static'
          NATIVE_BUILD_TARGET: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl,aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          WASM_TOOLCHAIN: nightly-2026-06-17
          # Accepts Microsoft's license for the CRT/SDK headers cargo-xwin downloads.
          XWIN_ACCEPT_LICENSE: '1'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-dist
          retention-days: 1
          path: ./dist

  test:
    name: Test ${{ matrix.settings.target }} (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        settings:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup QEMU
        if: runner.os == 'Linux' && contains(matrix.settings.target, 'aarch64')
        uses: docker/setup-qemu-action@v3

      - name: Install project dependencies
        run: |
          yarn install

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-dist
          path: ./dist

      - name: Run tests
        run: yarn test
