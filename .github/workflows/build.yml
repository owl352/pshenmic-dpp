name: Build

on:
  push:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]
  pull_request:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install rustfmt component
      run: rustup component add rustfmt

    - name: Add rustup WASM target
      run: |
        rustup target add wasm32-wasip1-threads

    - name: Add rustup mobile targets
      run: |
        rustup target add aarch64-apple-ios-sim aarch64-linux-android

    - name: Check Rust code linting rules
      run: |
        cargo fmt --check

    - name: Install Rust dependencies for WASM
      run: |
        cargo install wasm-bindgen-cli@0.2.105 wasm-opt

    - name: Install dependencies
      run: |
        yarn

    - name: Configure WASI C-Compiler for secp256k1-sys
      run: |
        RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d' ' -f1)
        CLANG_PATH=$(rustc --print sysroot)/lib/rustlib/wasm32-wasip1-threads/bin/clang
        echo "CC_wasm32_wasip1_threads=${CLANG_PATH}" >> $GITHUB_ENV
        SYSROOT_PATH=$(rustc --print sysroot)/lib/rustlib/wasm32-wasip1-threads/
        echo "CFLAGS_wasm32_wasip1_threads=--sysroot=${SYSROOT_PATH}" >> $GITHUB_ENV
        echo "WASI C-Compiler configured successfully."

    - name: Build JS bundle
      run: |
        yarn build:full

    - name: Run tests
      run: |
        yarn tests
