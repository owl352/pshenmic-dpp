name: Build

on:
  push:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]
  pull_request:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Add rustup WASM target
      run: |
        rustup target add wasm32-wasip1-threads

    - name: Add rustup mobile targets
      run: |
        rustup target add aarch64-apple-ios-sim aarch64-linux-android

    - name: Check Rust code linting rules
      run: |
        cargo fmt --check

    - name: Install Rust dependencies for WASM
      run: |
        cargo install wasm-bindgen-cli@0.2.105 wasm-opt

    - name: Install dependencies
      run: |
        yarn

    - name: Build JS bundle
      run: |
        yarn build:full

    - name: Run tests
      run: |
        yarn tests
