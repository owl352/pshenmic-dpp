name: Build

on:
  push:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]
  pull_request:
    branches: [ "master", "v1.1.0-dev", "v1.1.0", "v2.0.0-dev" ]

jobs:

  # === WASM, Linux/Windows ===
  build-native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        native-target: [
          x86_64-unknown-linux-gnu,
          aarch64-unknown-linux-gnu,
          x86_64-unknown-linux-musl,
          aarch64-unknown-linux-musl,
          x86_64-pc-windows-msvc,
          aarch64-pc-windows-msvc
        ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Zig
        run: |
          wget https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xf zig-linux-x86_64-0.13.0.tar.xz
          sudo mv zig-linux-x86_64-0.13.0/zig /usr/local/bin/zig

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Add Rust targets
        run: |
          rustup target add wasm32-wasip1-threads
          rustup target add aarch64-linux-android x86_64-linux-android aarch64-apple-ios-sim 

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib musl-tools pkg-config libssl-dev
          yarn
          cargo install wasm-bindgen-cli@0.2.105 wasm-opt

      - name: Build JS bundle
        run: yarn build:full

      - name: Run tests
        run: yarn test

  # === Apple targets ===
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        native-target: [x86_64-apple-darwin, aarch64-apple-darwin]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Zig on macOS
        run: |
          brew install zig

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Add Rust targets
        run: rustup target add ${{ matrix.native-target }} wasm32-wasip1-threads

      - name: Install dependencies
        run: |
          yarn
          cargo install wasm-bindgen-cli@0.2.105 wasm-opt

      - name: Build JS bundle
        run: yarn build:full

      - name: Run tests
        run: yarn test
