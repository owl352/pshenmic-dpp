name: Build dist

# Builds the package in parallel jobs (wasm + typings, one job per native target
# group, optionally the React Native bins), then assembles ./dist from their
# outputs and uploads it as the `build-artifact-dist` artifact.

on:
  workflow_call:
    inputs:
      native-groups:
        description: 'JSON array of {"name", "targets", "os"}: one build job per entry on runner "os", targets comma-separated'
        required: true
        type: string
      react-native:
        description: Build the React Native (Android/iOS) bins with ferric-cli
        required: false
        type: boolean
        default: false

env:
  WASM_TOOLCHAIN: nightly-2026-08-15

jobs:
  wasm:
    name: Build wasm + typings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # The wasm build rebuilds std with atomics (-Z build-std) for the Orchard
      # /Halo 2 proving stack, which requires nightly + rust-src. Pinned for
      # reproducible, flag-stable artifacts (see WASM_TOOLCHAIN above). Installed
      # first so the stable step below stays the rustup default (typings build).
      # Must stay on a 1.99 nightly: from 1.100 rustc links crt1-reactor.o itself,
      # which collides with the copy napi-build 2.3 adds (duplicate `_initialize`).
      # Newer napi-build detects this but requires emnapi v2.
      - name: Setup Rust nightly (wasm build-std)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-15
          targets: wasm32-wasip1-threads
          components: rust-src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-opt
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-opt

      # The C dependencies (secp256k1-sys, blst) need clang for wasm32 and
      # llvm-ar to archive them (GNU ar can't index wasm objects).
      - name: Install LLVM for WebAssembly
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install project dependencies
        run: yarn install --immutable

      - name: Build wasm and typings
        run: node build.cjs
        env:
          BUILD_STEPS: wasm,typings
          # Without a sysroot clang falls back to the host's glibc headers in
          # /usr/include, which break the wasm C builds ('bits/libc-header-start.h'
          # not found). An empty one leaves just clang's builtin headers, as on
          # macOS, which has no /usr/include.
          CFLAGS_wasm32_wasip1_threads: --sysroot=/nonexistent

      - name: Upload wasm and typings
        uses: actions/upload-artifact@v7
        with:
          name: bin-wasm
          retention-days: 1
          if-no-files-found: error
          path: |
            pkg/binaries/wasm
            pkg/binaries/pshenmic_dpp.d.ts

  native:
    name: Build native (${{ matrix.group.name }})
    runs-on: ${{ matrix.group.os }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.native-groups) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install Zig
        if: matrix.group.name == 'linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: ${{ matrix.group.targets }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.group.name }}

      # The Microsoft CRT/SDK headers cargo-xwin downloads for the windows-msvc
      # targets are ~1GB and are not covered by rust-cache.
      - name: Cache xwin CRT/SDK
        if: matrix.group.name == 'windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/cargo-xwin' || '~/.cache/cargo-xwin' }}
          key: ${{ runner.os }}-cargo-xwin

      - name: Install pre-built Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild, cargo-xwin

      # Same toolchain environment as before the build was split into jobs
      # (cargo-xwin needs clang-cl from it).
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      # cargo-xwin drives clang-cl, lld-link and llvm-lib. clang and lld pick
      # their MSVC-compatible mode from the name they're invoked by.
      - name: Install LLVM for cargo-xwin (Linux)
        if: runner.os == 'Linux' && matrix.group.name == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          sudo ln -sf "$(command -v clang)" /usr/local/bin/clang-cl
          sudo ln -sf "$(command -v ld.lld)" /usr/local/bin/lld-link
          clang-cl --version
          lld-link --version
          llvm-lib --help > /dev/null

      - name: Install project dependencies
        run: yarn install --immutable

      - name: Build native binaries
        run: node build.cjs
        env:
          BUILD_STEPS: native
          NATIVE_BUILD_TARGET: ${{ matrix.group.targets }}
          RUSTFLAGS: '-C target-feature=-crt-static'
          # Accepts Microsoft's license for the CRT/SDK headers cargo-xwin downloads.
          XWIN_ACCEPT_LICENSE: '1'

      - name: Upload native binaries
        uses: actions/upload-artifact@v7
        with:
          name: bin-native-${{ matrix.group.name }}
          retention-days: 1
          if-no-files-found: error
          path: pkg/binaries/native

  react-native:
    name: Build React Native
    if: inputs.react-native
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Default is 'tools platform-tools'; legacy 'tools' was removed from the
          # SDK repository and sdkmanager now fails to find it.
          packages: 'platform-tools'

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.1.12297006"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: aarch64-linux-android, x86_64-linux-android, aarch64-apple-ios-sim

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: react-native

      - name: Install LLVM
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Install project dependencies
        run: yarn install --immutable

      - name: Build React Native binaries
        run: node build.cjs
        env:
          BUILD_STEPS: react-native
          RUSTFLAGS: '-C target-feature=-crt-static'

      - name: Upload React Native binaries
        uses: actions/upload-artifact@v7
        with:
          name: bin-react-native
          retention-days: 1
          if-no-files-found: error
          path: pkg/binaries/*.node

  assemble:
    name: Assemble dist
    needs: [wasm, native, react-native]
    # react-native is skipped unless requested; everything that ran must pass.
    if: >-
      !cancelled()
      && needs.wasm.result == 'success'
      && needs.native.result == 'success'
      && (needs.react-native.result == 'success' || needs.react-native.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install project dependencies
        run: yarn install --immutable

      - name: Download wasm and typings
        uses: actions/download-artifact@v8
        with:
          name: bin-wasm
          path: pkg/binaries

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-native-*
          merge-multiple: true
          path: pkg/binaries/native

      - name: Download React Native binaries
        if: inputs.react-native
        uses: actions/download-artifact@v8
        with:
          name: bin-react-native
          path: pkg/binaries

      - name: Generate bindings and build TS
        run: |
          node build.cjs
          yarn build:ts
        env:
          BUILD_STEPS: bundle

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-dist
          retention-days: 1
          path: ./dist
